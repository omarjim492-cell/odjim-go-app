<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODJIM Solution | Serviços Profissionais</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
// Configuração do teu Firebase
firebase.initializeApp({
  apiKey: "AIzaSyCUB0t9wvZp2pXhjYmv2G7AeToWNekJRTg",
  authDomain: "odjim-solution.firebaseapp.com",
  projectId: "odjim-solution",
  storageBucket: "odjim-solution.firebasestorage.app",
  messagingSenderId: "165673018775",
  appId: "1:165673018775:web:c8b4cc6345b854763950d2"
});

const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

// Camada de Serviço ODJIM
const ODJIM = {
  serverTimestamp: () => firebase.firestore.FieldValue.serverTimestamp(),
  userRef: uid => db.collection("usuarios").doc(uid),
  tecnicoRef: uid => db.collection("tecnicos").doc(uid),
  pedidoRef: id => db.collection("pedidos").doc(id),
  async getRole(user = auth.currentUser) {
    if (!user) return null;
    const snap = await db.collection("usuarios").doc(user.uid).get();
    return snap.exists ? (snap.data().role || null) : null;
  },
  async requireRole(role) {
    const user = auth.currentUser;
    if (!user) throw new Error("Sessão não autenticada.");
    const current = await this.getRole(user);
    if (current !== role && !(role === "admin" && current === "superadmin")) throw new Error("Acesso não autorizado.");
    return user;
  },
  async audit(acao, entidade, entidadeId, extras = {}) {
    const user = auth.currentUser;
    if (!user) return;
    return db.collection("auditoria").add({
      atorUid: user.uid, acao, entidade, entidadeId,
      ...extras, criadoEm: this.serverTimestamp()
    });
  }
};
</script>

<style>
:root {
    --bg: #0f172a; --accent: #ff9800; --accent2: #ff5722; --text: #f8fafc; 
    --muted: #94a3b8; --glass: rgba(30,41,59,0.7); --border: rgba(255,255,255,0.08); 
    --radius: 16px; --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
body { background: radial-gradient(circle at top right, #1e1b4b, var(--bg)); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* Animações Profissionais */
@keyframes reveal { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes skeleton-pulse { 0% { background: rgba(255,255,255,0.05); } 50% { background: rgba(255,255,255,0.1); } 100% { background: rgba(255,255,255,0.05); } }
.fade-up { animation: reveal 0.5s var(--ease) forwards; }
.skeleton { animation: skeleton-pulse 1.5s infinite; border-radius: 8px; background: rgba(255,255,255,0.05); }

/* UI Elements */
.card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); padding: 22px; border-radius: var(--radius); margin-bottom: 20px; }
.btn { border: none; padding: 14px; width: 100%; font-size: 15px; font-weight: 700; border-radius: 12px; cursor: pointer; transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
.btn-primary:active { transform: scale(0.96); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

/* Telas e Nav */
.tela { display: none; min-height: 100vh; flex-direction: column; padding-bottom: 40px; }
.tela.ativa { display: flex; animation: reveal 0.4s var(--ease); }
.topbar { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--glass); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.conteudo { flex: 1; padding: 20px; max-width: 500px; width: 100%; margin: 0 auto; }

/* Map & Forms */
#mapa { height: 200px; width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border); }
input, select, textarea { width: 100%; background: rgba(15,23,42,0.8); border: 1px solid var(--border); padding: 13px; color: var(--text); border-radius: 12px; margin-top: 5px; outline: none; }
label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); }

/* Chat Bubbles */
.msg { padding: 10px 14px; border-radius: 14px; max-width: 85%; font-size: 14px; margin-bottom: 8px; }
.msg.eu { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 2px; }
.msg.outro { align-self: flex-start; background: rgba(255,255,255,0.1); border-bottom-left-radius: 2px; }

/* Emoji Feedback */
.emojis-row { display: flex; justify-content: space-around; margin: 20px 0; }
.emoji-btn { cursor: pointer; font-size: 30px; transition: 0.3s; filter: grayscale(1); }
.emoji-btn.sel { filter: grayscale(0); transform: scale(1.3); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.aberto { display: flex; }
.modal { background: #1e293b; border-radius: var(--radius); padding: 24px; width: 100%; max-width: 400px; }

/* Dashboard Relatórios */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
.stat-val { font-size: 24px; font-weight: 800; color: var(--accent); }
</style>
</head>
<body>

<div id="toast" style="display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--accent2); color:white; padding:12px 24px; border-radius:50px; z-index:9999; font-weight:700;"></div>

<!-- SPLASH SCREEN -->
<div id="splash" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:30px;">
  <div style="text-align:center;">
    <h1 style="font-size:42px; font-weight:800; background:linear-gradient(to right,#ff9800,#ff5722); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">ODJIM Solution</h1>
    <p style="color:var(--muted);">Tecnologia em Angola 🚀</p>
  </div>
  <div style="display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; padding:20px;">
    <button class="btn btn-primary" onclick="irCliente()">Sou Cliente</button>
    <button class="btn btn-outline" onclick="irPara('tecnico')">Sou Técnico</button>
    <button class="btn btn-outline" onclick="irPara('admin')">Administração</button>
  </div>
</div>

<!-- TELA CLIENTE -->
<div id="tela-cliente" class="tela">
  <div class="topbar">
    <button onclick="voltar()" style="background:none; border:none; color:white; font-size:24px;">‹</button>
    <h2 style="flex:1;">Painel Cliente</h2>
    <span id="cliente-nome" style="font-size:12px; color:var(--accent);">Aceder...</span>
  </div>
  <div class="conteudo">
    <div class="card">
      <h3>Solicitar Novo Serviço</h3>
      <div style="margin-top:15px;">
        <label>Tipo de Serviço</label>
        <select id="c-servico">
          <option>Informática</option><option>Electricidade</option><option>CCTV</option><option>Limpeza</option>
        </select>
        <label style="margin-top:10px; display:block;">Descrição do Problema</label>
        <textarea id="c-desc" placeholder="Ex: O meu AC não gela..."></textarea>
        
        <label style="margin-top:10px; display:block;">Foto do Problema</label>
        <input type="file" id="c-foto" accept="image/*" style="display:none;" onchange="previewImg(event)">
        <button class="btn btn-outline" style="margin-top:5px;" onclick="document.getElementById('c-foto').click()">📸 Anexar Foto</button>
        <img id="p-img" style="display:none; width:100%; border-radius:10px; margin-top:10px;">

        <label style="margin-top:10px; display:block;">Sua Localização</label>
        <input id="c-local" readonly placeholder="Clique no mapa...">
        <div id="mapa"></div>
        <button class="btn btn-primary" style="margin-top:20px;" onclick="enviarPedido()">🚀 Enviar Pedido</button>
      </div>
    </div>

    <div class="card">
      <h3>Meus Pedidos</h3>
      <div id="lista-meus-pedidos"></div>
    </div>

    <div class="card">
        <h3>Como foi a experiência?</h3>
        <div class="emojis-row">
            <span class="emoji-btn" onclick="avaliar(this,1)">😡</span>
            <span class="emoji-btn" onclick="avaliar(this,3)">😐</span>
            <span class="emoji-btn" onclick="avaliar(this,5)">🤩</span>
        </div>
        <button class="btn btn-outline" onclick="enviarAvaliacao()">Enviar Feedback</button>
    </div>
  </div>
</div>

<!-- TELA TÉCNICO -->
<div id="tela-tecnico" class="tela">
    <div class="topbar"><button onclick="voltar()">‹</button><h2>Painel Técnico</h2></div>
    <div class="conteudo">
        <div id="login-tecnico-box" class="card">
            <h3>Entrar como Técnico</h3>
            <input id="t-email" placeholder="Email">
            <input id="t-pass" type="password" placeholder="Senha">
            <button class="btn btn-primary" onclick="loginT()">Entrar</button>
        </div>
        <div id="painel-tecnico-box" style="display:none;">
            <h3>Pedidos Disponíveis</h3>
            <div id="lista-pedidos-tecnico"></div>
        </div>
    </div>
</div>

<!-- TELA ADMIN -->
<div id="tela-admin" class="tela">
    <div class="topbar"><button onclick="voltar()">‹</button><h2>Admin Dashboard</h2></div>
    <div class="conteudo">
        <div id="login-admin-box" class="card">
            <input id="a-email" placeholder="Admin Email">
            <input id="a-pass" type="password" placeholder="Senha">
            <button class="btn btn-primary" onclick="loginA()">Entrar</button>
        </div>
        <div id="painel-admin-box" style="display:none;">
            <div class="stat-grid">
                <div class="stat-box"><div class="stat-val" id="st-total">0</div><div style="font-size:10px;">PEDIDOS</div></div>
                <div class="stat-box"><div class="stat-val" id="st-nota">0.0</div><div style="font-size:10px;">NOTA MÉDIA</div></div>
            </div>
            <button class="btn btn-outline" onclick="exportCSV()">📥 Exportar Dados CSV</button>
            <h3 style="margin:20px 0 10px;">Gestão de Pedidos</h3>
            <div id="lista-admin-pedidos"></div>
        </div>
    </div>
</div>

<!-- MODAL CHAT -->
<div id="chat-modal" class="modal-overlay">
    <div class="modal" style="height:70vh; display:flex; flex-direction:column;">
        <h3 id="chat-t">Chat</h3>
        <div id="chat-msgs" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:10px;"></div>
        <div style="display:flex; gap:10px;">
            <input id="chat-in" placeholder="Escreva...">
            <button onclick="sendMsg()" style="padding:10px; background:var(--accent); border:none; border-radius:10px;">➔</button>
        </div>
        <button class="btn" onclick="closeChat()">Fechar</button>
    </div>
</div>

<!-- LOGIN CLIENTE MODAL -->
<div id="modal-auth" class="modal-overlay">
    <div class="modal">
        <h3>👤 Entrar / Registar</h3>
        <input id="au-email" placeholder="Email">
        <input id="au-pass" type="password" placeholder="Senha">
        <button class="btn btn-primary" style="margin-top:10px;" onclick="authAcao('login')">Entrar</button>
        <button class="btn btn-outline" style="margin-top:10px;" onclick="authAcao('reg')">Criar Conta</button>
    </div>
</div>

<script>
// --- CORE LOGIC ---
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",3000)}
function irPara(t){
    document.getElementById("splash").style.display="none";
    document.querySelectorAll(".tela").forEach(x=>x.classList.remove("ativa"));
    document.getElementById("tela-"+t).classList.add("ativa");
    if(t==='cliente') initMap();
}
function voltar(){location.reload();}

// --- AUTH ---
async function irCliente(){
    if(auth.currentUser) {
        irPara("cliente");
        document.getElementById("cliente-nome").textContent = auth.currentUser.displayName || "Utilizador";
        loadMeusPedidos();
    } else {
        document.getElementById("modal-auth").classList.add("aberto");
    }
}

async function authAcao(tipo){
    const e=document.getElementById("au-email").value, p=document.getElementById("au-pass").value;
    try {
        if(tipo==='login') await auth.signInWithEmailAndPassword(e,p);
        else {
            const c = await auth.createUserWithEmailAndPassword(e,p);
            await c.user.updateProfile({displayName: e.split('@')[0]});
            await db.collection("usuarios").doc(c.user.uid).set({email:e, role:'cliente', criadoEm: ODJIM.serverTimestamp()});
        }
        location.reload();
    } catch(err){ toast(err.message); }
}

// --- MAP & REVERSE GEOCODING ---
let map, marker;
function initMap(){
    if(map) return;
    map = L.map('mapa').setView([-8.8383, 13.2344], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    map.on('click', async e => {
        const {lat, lng} = e.latlng;
        if(marker) marker.setLatLng(e.latlng); else marker = L.marker(e.latlng).addTo(map);
        document.getElementById("c-local").value = "A localizar morada...";
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
            const data = await res.json();
            document.getElementById("c-local").value = data.display_name;
        } catch { document.getElementById("c-local").value = `${lat}, ${lng}`; }
    });
}

// --- PEDIDOS & UPLOAD ---
let fotoF = null;
function previewImg(e){
    fotoF = e.target.files[0];
    const r = new FileReader();
    r.onload = x => { const i=document.getElementById("p-img"); i.src=x.target.result; i.style.display="block"; }
    r.readAsDataURL(fotoF);
}

async function enviarPedido(){
    const serv = document.getElementById("c-servico").value;
    const desc = document.getElementById("c-desc").value;
    const loc = document.getElementById("c-local").value;
    if(!loc) return toast("Selecione o local no mapa!");

    try {
        toast("A enviar pedido...");
        let url = "";
        const id = db.collection("pedidos").doc().id;
        if(fotoF){
            const ref = storage.ref(`pedidos/${id}`);
            await ref.put(fotoF);
            url = await ref.getDownloadURL();
        }
        await db.collection("pedidos").doc(id).set({
            id, servico:serv, descricao:desc, local:loc, foto:url,
            clienteUid: auth.currentUser.uid, clienteNome: auth.currentUser.displayName,
            estado: "AGUARDANDO", criadoEm: ODJIM.serverTimestamp()
        });
        toast("✅ Sucesso!");
        setTimeout(()=>location.reload(), 2000);
    } catch(err){ toast(err.message); }
}

// --- CHAT LOGIC ---
let chatID = null, unsubC = null;
function openChat(id, t){
    chatID = id; document.getElementById("chat-t").textContent = t;
    document.getElementById("chat-modal").classList.add("aberto");
    unsubC = db.collection("pedidos").doc(id).collection("chat").orderBy("criadoEm","asc").onSnapshot(s => {
        const b = document.getElementById("chat-msgs"); b.innerHTML = "";
        s.forEach(d => {
            const m = d.data();
            const sou = m.uid === auth.currentUser.uid;
            b.innerHTML += `<div class="msg ${sou?'eu':'outro'}"><strong>${m.nome}</strong><br>${m.txt}</div>`;
        });
        b.scrollTop = b.scrollHeight;
    });
}
function closeChat(){ document.getElementById("chat-modal").classList.remove("aberto"); if(unsubC) unsubC(); }
async function sendMsg(){
    const i = document.getElementById("chat-in");
    if(!i.value) return;
    await db.collection("pedidos").doc(chatID).collection("chat").add({
        txt: i.value, uid: auth.currentUser.uid, nome: auth.currentUser.displayName, criadoEm: ODJIM.serverTimestamp()
    });
    i.value = "";
}

// --- TÉCNICO & ADMIN ---
async function loginT(){
    try {
        const e=document.getElementById("t-email").value, p=document.getElementById("t-pass").value;
        const res = await auth.signInWithEmailAndPassword(e,p);
        const u = await db.collection("usuarios").doc(res.user.uid).get();
        if(u.data().role !== 'tecnico') return toast("Acesso negado.");
        document.getElementById("login-tecnico-box").style.display="none";
        document.getElementById("painel-tecnico-box").style.display="block";
        loadPedidosTecnico();
    } catch(err){ toast(err.message); }
}

function loadPedidosTecnico(){
    db.collection("pedidos").where("estado","==","AGUARDANDO").onSnapshot(s => {
        const l = document.getElementById("lista-pedidos-tecnico"); l.innerHTML = "";
        s.forEach(d => {
            const p = d.data();
            l.innerHTML += `<div class="card"><h4>${p.servico}</h4><p>${p.local}</p>
                <button class="btn btn-primary" onclick="aceitar('${p.id}')">Aceitar Serviço</button></div>`;
        });
    });
}

async function aceitar(id){
    await db.collection("pedidos").doc(id).update({estado: "EM_CAMINHO", tecnicoUid: auth.currentUser.uid, tecnicoNome: auth.currentUser.displayName});
    toast("Serviço aceite!");
    setTimeout(()=>openChat(id, "Conversa com Cliente"), 500);
}

// --- ADMIN DASHBOARD ---
async function loginA(){
    const e=document.getElementById("a-email").value, p=document.getElementById("a-pass").value;
    const res = await auth.signInWithEmailAndPassword(e,p);
    const u = await db.collection("usuarios").doc(res.user.uid).get();
    if(u.data().role !== 'admin') return toast("Acesso restrito.");
    document.getElementById("login-admin-box").style.display="none";
    document.getElementById("painel-admin-box").style.display="block";
    loadAdminStats();
}

async function loadAdminStats(){
    db.collection("pedidos").onSnapshot(s => {
        document.getElementById("st-total").textContent = s.size;
        const l = document.getElementById("lista-admin-pedidos"); l.innerHTML = "";
        s.forEach(d => {
            const p = d.data();
            l.innerHTML += `<div class="card" style="font-size:12px;">
                <strong>${p.servico}</strong> - ${p.estado} <br>
                <button onclick="openChat('${p.id}','Admin Supervision')">👁️ Ver Chat</button>
            </div>`;
        });
    });
}

async function exportCSV(){
    const s = await db.collection("pedidos").get();
    let csv = "Servico,Estado,Cliente,Local\n";
    s.forEach(d => { const p=d.data(); csv += `${p.servico},${p.estado},${p.clienteNome},${p.local}\n`; });
    const b = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'relatorio_odjim.csv'; a.click();
}

function loadMeusPedidos(){
    db.collection("pedidos").where("clienteUid","==",auth.currentUser.uid).onSnapshot(s => {
        const l = document.getElementById("lista-meus-pedidos"); l.innerHTML = "";
        s.forEach(d => {
            const p = d.data();
            l.innerHTML += `<div class="card"><strong>${p.servico}</strong>: ${p.estado} 
                <button class="btn btn-outline" style="margin-top:10px;" onclick="openChat('${p.id}','Suporte Técnico')">💬 Chat</button></div>`;
        });
    });
}

let notaS = 0;
function avaliar(el, n){ 
    document.querySelectorAll(".emoji-btn").forEach(x=>x.classList.remove("sel")); 
    el.classList.add("sel"); notaS = n; 
}
async function enviarAvaliacao(){
    if(!notaS) return toast("Escolha um emoji!");
    await db.collection("avaliacoes").add({nota:notaS, uid:auth.currentUser.uid, criadoEm: ODJIM.serverTimestamp()});
    toast("Obrigado!");
}
</script>
</body>
</html>
